name: Lint

# Fast static checks on every push / pull request. Nothing here runs the
# pipeline -- see smoke-test.yml for that.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ShellCheck every bash script. config.sh.example is a template with
      # placeholder values, so it is excluded.
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_names: config.sh.example

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Parse (not run) every R file: catches syntax errors only.
      - name: R syntax check
        run: |
          Rscript -e 'files <- list.files(".", pattern = "\\.R$|\\.R\\.example$", recursive = TRUE, full.names = TRUE); for (f in files) { cat("parsing", f, "\n"); invisible(parse(f)) }; cat("OK:", length(files), "R files\n")'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Compile every tracked .py file wherever it lives in the repo.
      - name: Python syntax check
        run: |
          files=$(git ls-files '*.py')
          if [ -z "${files}" ]; then echo "no Python files"; exit 0; fi
          echo "${files}"
          # shellcheck disable=SC2086
          python -m py_compile ${files}
